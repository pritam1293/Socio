version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: socio-db
    environment:
      POSTGRES_USER: socio
      POSTGRES_PASSWORD: socio_dev_pass
      POSTGRES_DB: socio
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socio"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: socio-backend
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      DATABASE_URL: "postgres://socio:socio_dev_pass@postgres:5432/socio?sslmode=disable"
      JWT_SECRET: "dev-jwt-secret-change-in-production"
      JWT_ACCESS_EXPIRY: "15m"
      JWT_REFRESH_EXPIRY: "7d"
      ENCRYPTION_KEY: "12345678901234567890123456789012"
      SMTP_HOST: "${SMTP_HOST:-smtp.gmail.com}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USERNAME: "${SMTP_USERNAME}"
      SMTP_PASSWORD: "${SMTP_PASSWORD}"
      SMTP_FROM: "${SMTP_FROM}"
      APP_URL: "http://localhost:8080"
      FRONTEND_URL: "http://localhost:3000"
      TWITTER_CLIENT_ID: "${TWITTER_CLIENT_ID:-}"
      TWITTER_CLIENT_SECRET: "${TWITTER_CLIENT_SECRET:-}"
      TWITTER_CALLBACK_URL: "http://localhost:8080/api/v1/social/twitter/callback"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
